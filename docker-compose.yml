services:
  beijian:
    build: .
    container_name: beijian
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - DATABASE_URL=file:./data/dev.db
      - JWT_SECRET=admin123
    volumes:
      # Persist db + backups under ./data (directory mount avoids Docker file-as-directory issue)
      - ./data:/app/data
      # Import file (optional)
      - ./beijian.xlsx:/app/beijian.xlsx:ro
